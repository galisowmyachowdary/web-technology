 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anchor tag</title>
 </head>
 <body>
    <h2>target "_self"</h2>
    <a href="https://www.google.com" target="_self">open google</a>
    <a href="https://www.wikipedia.org" target="_self">open wikipedia</a>
    <a href="https://www.amazon.com" target="_self">open amezon</a>
    <a href="https://www.flipkart.com" target="_self">open flipkart</a>
    <a href="https://www.swiggy.com" target="-self">open swiggy</a>
    <h2>target "_blank"</h2>
    <a href="https://www.youtube.com" target="_blank">sun</a>
    <a href="https://www.github.com" target="_blank">moon</a>
    <a href="https://www.linkedin.com" target="_blank">earth</a>
    <a href="https://www.instagram.com" target="-blank">trees</a>
    <a href="https://www.maps.google.com" target="_blank">open maps</a>
 </body>
 </html>
